<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Endpoint Detection Lab</title>
    <link rel="icon" href="/assets/shield-check.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="/assets/shield-check.svg" alt="" width="28" height="28" />
        <h1>Endpoint Detection Lab</h1>
      </div>
      <span class="local">LOCAL / READ ONLY</span>
    </header>
    <div class="shell">
      <aside>
        <nav aria-label="분석 보기">
          <button data-view="alerts" aria-pressed="true">
            <img src="/assets/shield-check.svg" alt="" />탐지 사건<span
              id="nav-alerts"
              >0</span
            >
          </button>
          <button data-view="timeline" aria-pressed="false">
            <img src="/assets/list.svg" alt="" />타임라인
          </button>
          <button data-view="processes" aria-pressed="false">
            <img src="/assets/git-branch.svg" alt="" />프로세스 트리
          </button>
          <button data-view="validation" aria-pressed="false">
            <img src="/assets/flask-conical.svg" alt="" />규칙 검증
          </button>
          <button data-view="rules" aria-pressed="false">
            <img src="/assets/file-code.svg" alt="" />탐지 규칙
          </button>
        </nav>
        <div class="aside-foot">v0.1.0<br />악성코드 판정·자동 차단 없음</div>
      </aside>
      <main>
        <section class="source-bar" aria-label="분석 입력">
          <div class="source-select">
            <label for="scenario">합성 시나리오</label
            ><select id="scenario" disabled></select>
          </div>
          <label class="upload-button" title="Sysmon XML 또는 정규화 JSON 열기"
            ><img src="/assets/upload.svg" alt="" />로그 열기<input
              id="file"
              type="file"
              accept=".json,.xml"
              aria-label="로그 파일 선택"
          /></label>
          <button
            id="reset"
            class="icon-button"
            title="기본 시나리오로 초기화"
            aria-label="기본 시나리오로 초기화"
          >
            <img src="/assets/rotate-ccw.svg" alt="" />
          </button>
          <button
            id="export"
            class="icon-button"
            title="JSON 보고서 저장"
            aria-label="JSON 보고서 저장"
            disabled
          >
            <img src="/assets/download.svg" alt="" />
          </button>
        </section>
        <div class="status-line">
          <span id="source-name">데이터 준비 중</span
          ><span id="status" role="status" aria-live="polite">연결 중</span
          ><button id="cancel" hidden>취소</button>
        </div>
        <section id="analysis" hidden>
          <div class="metrics">
            <div>
              <span>분석 이벤트</span><strong id="metric-events">0</strong>
            </div>
            <div>
              <span>프로세스</span><strong id="metric-processes">0</strong>
            </div>
            <div>
              <span>탐지 징후</span><strong id="metric-alerts">0</strong>
            </div>
            <div>
              <span>정책으로 제외</span
              ><strong id="metric-suppressed">0</strong>
            </div>
          </div>
          <section class="replay-bar" aria-label="로그 재생">
            <button
              id="play"
              class="icon-button"
              title="재생"
              aria-label="재생"
            >
              <img id="play-icon" src="/assets/play.svg" alt="" /></button
            ><button
              id="step"
              class="icon-button"
              title="다음 이벤트"
              aria-label="다음 이벤트"
            >
              <img src="/assets/skip-forward.svg" alt="" />
            </button>
            <label class="sr-only" for="replay">재생 이벤트 수</label
            ><input id="replay" type="range" min="0" max="0" value="0" /><output
              id="replay-position"
              for="replay"
              >0 / 0</output
            >
            <div class="policy-switch" role="group" aria-label="탐지 정책">
              <button data-policy="baseline" aria-pressed="true">기본</button
              ><button data-policy="tuned" aria-pressed="false">
                오탐 조정
              </button>
            </div>
          </section>
          <div id="quality" class="quality" role="note"></div>
        </section>
        <div class="view-heading">
          <h2 id="view-title">탐지 사건</h2>
          <span id="view-count"></span>
        </div>
        <section id="filters" class="filters" aria-label="결과 필터">
          <label class="search"
            ><img src="/assets/search.svg" alt="" /><input
              id="search"
              type="search"
              placeholder="파일·호스트·명령 검색"
              aria-label="결과 검색"
          /></label>
          <select id="host" aria-label="호스트 필터">
            <option value="">전체 호스트</option></select
          ><select id="severity" aria-label="위험도 필터">
            <option value="">전체 위험도</option>
            <option value="high">높음</option>
            <option value="medium">주의</option>
          </select>
        </section>
        <section id="alerts-view" class="view">
          <div id="alert-list" class="table-scroll"></div>
          <details id="suppressed-section" hidden>
            <summary id="suppressed-summary">정책 제외 기록</summary>
            <div id="suppressed-list"></div>
          </details>
        </section>
        <section id="timeline-view" class="view" hidden>
          <div id="timeline-list" class="table-scroll"></div>
        </section>
        <section id="processes-view" class="view" hidden>
          <div id="process-list"></div>
        </section>
        <section id="validation-view" class="view" hidden>
          <div id="verification"></div>
        </section>
        <section id="rules-view" class="view" hidden>
          <div id="rule-list"></div>
        </section>
        <div id="pagination" class="pagination" hidden>
          <button id="previous" aria-label="이전 페이지">이전</button
          ><span id="page-position"></span
          ><button id="next" aria-label="다음 페이지">다음</button>
        </div>
        <section
          id="detail"
          class="detail"
          hidden
          aria-labelledby="detail-title"
        >
          <div class="section-heading">
            <h3 id="detail-title">분석 근거</h3>
            <button
              id="close-detail"
              class="icon-button"
              title="상세 닫기"
              aria-label="상세 닫기"
            >
              <img src="/assets/x.svg" alt="" />
            </button>
          </div>
          <div id="detail-content"></div>
        </section>
        <footer>
          <span>선택한 로그만 분석 · 외부 전송·파일 저장 없음</span
          ><span id="data-label">합성 데이터</span>
        </footer>
      </main>
    </div>
  </body>
</html>
